<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROZEVA | Customer Reviews</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .csp-12__sw {
            appearance: none;
            position: relative;
            flex: none;
            width: 38px;
            height: 22px;
            border-radius: 999px;
            background: oklch(0.89 0.008 160);
            cursor: pointer;
            vertical-align: middle;
            transition: background .2s;
        }

        .csp-12__sw::before {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 3px oklch(0 0 0/.25);
            transition: translate .2s cubic-bezier(.3, .7, .4, 1.3);
        }

        .csp-12__sw:checked {
            background: var(--accent);
        }

        .csp-12__sw:checked::before {
            translate: 16px 0;
        }

    </style>
</head>

<body class="min-h-screen bg-pink-50 font-sans text-gray-800">


   <td><input type="checkbox" class="csp-12__sw" checked aria-label="Email: Mentions and replies"></td>
                            
                        
</body>

</html>

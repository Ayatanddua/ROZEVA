<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROZEVA | Customer Reviews</title>
    <link rel="icon" type="image/png" href="./images/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-pink-50 font-sans text-gray-800">

    <!-- header -->
  <header class="absolute inset-x-0 top-0 z-20 flex items-center justify-between px-6 py-7 sm:px-12">
    <a href="#" class="text-2xl font-bold tracking-[-0.04em] text-white">ROZEVA<span class="text-tnv13-acc">.</span></a>
    <nav aria-label="Main" class="hidden md:block">
      <ul
        class="flex items-center gap-2 text-[15px] font-medium text-tnv13-mut [&_a]:relative [&_a]:block [&_a]:rounded-xl [&_a]:px-4 [&_a]:py-2.5 [&_a]:[--tnv13-dx:0px] [&_a]:[--tnv13-dy:0px] [&_a]:translate-x-(--tnv13-dx) [&_a]:translate-y-(--tnv13-dy) [&_a]:transition-colors [&_a]:before:absolute [&_a]:before:inset-0 [&_a]:before:-z-10 [&_a]:before:scale-75 [&_a]:before:rounded-xl [&_a]:before:bg-white/[0.06] [&_a]:before:opacity-0 [&_a]:before:transition-[scale,opacity] [&_a]:before:duration-300 [&_a]:before:ease-[cubic-bezier(.34,1.56,.64,1)] [&_a]:before:content-[''] [&_a:hover]:text-white [&_a:hover]:before:scale-100 [&_a:hover]:before:opacity-100 [&_a:focus-visible]:text-white [&_a:focus-visible]:outline-2 [&_a:focus-visible]:outline-tnv13-acc [&_a[aria-current]]:text-white [&_span]:block [&_span]:translate-x-[calc(var(--tnv13-dx)*0.6)] [&_span]:translate-y-[calc(var(--tnv13-dy)*0.6)]">
        <li><a href="index.html" data-magnet><span>Home</span></a></li>
        <li><a href="product.html"data-magnet><span>Products</span></a></li>
        <li><a href="contact.html" data-magnet><span>Contact</span></a></li>
        <li><a href="reviews.html"data-magnet aria-current="page"><span>Reviews</span></a></li>
      </ul>
    </nav>
  </header>

    <!-- Hero -->
    <section class="px-5 pb-8 pt-12 text-center">
        <h1 class="mb-3 text-3xl font-bold text-pink-600 md:text-5xl">
            Customer Reviews
        </h1>

        <p class="text-gray-500">
            Your feedback makes us better.
        </p>

        <p class="mt-2 text-gray-500">
            Share your experience with ROZEVA!
        </p>
    </section>

    <!-- Review Form -->
    <section class="mx-auto mb-16 w-full max-w-2xl px-4">
        <div class="rounded-2xl border border-pink-100 bg-white p-6 shadow-lg md:p-9">

            <h2 class="mb-7 text-2xl font-bold text-pink-600">
                Write Your Review
            </h2>

            <form id="reviewForm">

                <!-- Name -->
                <label for="customerName"
                       class="mb-2 block text-sm font-semibold">
                    Your Name
                </label>

                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter your name"
                    required
                    class="mb-6 w-full rounded-lg border border-pink-200 px-4 py-3 outline-none focus:border-pink-500 focus:ring-2 focus:ring-pink-100"
                >

                <!-- Rating -->
                <label class="mb-3 block text-sm font-semibold">
                    How would you rate us?
                </label>

                <div id="stars" class="mb-6 flex gap-2">
                    <button type="button" data-value="1" aria-label="1 star"
                        class="text-4xl text-gray-300 transition hover:scale-110">★</button>
                    <button type="button" data-value="2" aria-label="2 stars"
                        class="text-4xl text-gray-300 transition hover:scale-110">★</button>
                    <button type="button" data-value="3" aria-label="3 stars"
                        class="text-4xl text-gray-300 transition hover:scale-110">★</button>
                    <button type="button" data-value="4" aria-label="4 stars"
                        class="text-4xl text-gray-300 transition hover:scale-110">★</button>
                    <button type="button" data-value="5" aria-label="5 stars"
                        class="text-4xl text-gray-300 transition hover:scale-110">★</button>
                </div>

                <!-- Review -->
                <label for="reviewText"
                       class="mb-2 block text-sm font-semibold">
                    Your Review
                </label>

                <textarea
                    id="reviewText"
                    rows="5"
                    placeholder="Write your experience here..."
                    required
                    class="mb-6 w-full resize-y rounded-lg border border-pink-200 px-4 py-3 outline-none focus:border-pink-500 focus:ring-2 focus:ring-pink-100"
                ></textarea>

                <!-- Photo Upload -->
                <label class="mb-3 block text-sm font-semibold">
                    Add a Photo (Optional)
                </label>

                <label for="photo"
                    class="inline-flex cursor-pointer items-center gap-3 rounded-xl border border-dashed border-pink-400 bg-pink-50 px-5 py-3 font-semibold text-pink-600 transition hover:bg-pink-100">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         class="h-6 w-6"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="1.8">
                        <rect x="3" y="3" width="18" height="18" rx="3"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M21 15l-5-5L5 21"/>
                    </svg>

                    Choose Photo
                </label>

                <input
                    type="file"
                    id="photo"
                    accept="image/*"
                    class="hidden"
                >

                <!-- Image Preview -->
                <div id="previewContainer" class="mt-4 hidden">
                    <img
                        id="photoPreview"
                        alt="Selected photo preview"
                        class="h-40 w-40 rounded-xl border border-pink-200 object-cover"
                    >

                    <button
                        type="button"
                        id="removePhoto"
                        class="mt-3 rounded-lg border border-pink-300 bg-pink-50 px-4 py-2 text-sm font-semibold text-pink-600 transition hover:bg-pink-100"
                    >
                        ✕ Remove Photo
                    </button>
                </div>

                <!-- Send -->
                <button
                    type="submit"
                    class="mt-8 w-full rounded-xl bg-pink-600 px-5 py-4 font-bold text-white shadow-md transition duration-300 hover:bg-pink-700 hover:shadow-lg"
                >
                    Send Review
                </button>

            </form>
        </div>
    </section>

    <!-- Customer Reviews -->
    <section class="mx-auto mb-16 max-w-6xl px-5">

        <h2 class="mb-8 text-center text-3xl font-bold text-pink-600">
            What Our Customers Say
        </h2>

        <div id="reviewsList"
             class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">

            <p id="emptyMessage"
               class="col-span-full py-8 text-center text-gray-500">
                No reviews yet. Be the first to share your experience!
            </p>

        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-pink-100 px-5 py-6 text-center text-sm text-pink-700">
        © 2026 ROZEVA. All rights reserved.
    </footer>

    <script>
        var stars = document.querySelectorAll("#stars button");
        var selectedRating = 0;

        var photoInput = document.querySelector("#photo");
        var photoPreview = document.querySelector("#photoPreview");
        var previewContainer = document.querySelector("#previewContainer");
        var removePhoto = document.querySelector("#removePhoto");

        var reviewForm = document.querySelector("#reviewForm");
        var reviewsList = document.querySelector("#reviewsList");
        var emptyMessage = document.querySelector("#emptyMessage");

        var selectedPhoto = "";

        // Star rating
        stars.forEach(function(star) {
            star.addEventListener("click", function() {
                selectedRating = Number(star.dataset.value);

                stars.forEach(function(item) {
                    if (Number(item.dataset.value) <= selectedRating) {
                        item.classList.remove("text-gray-300");
                        item.classList.add("text-amber-400");
                    } else {
                        item.classList.remove("text-amber-400");
                        item.classList.add("text-gray-300");
                    }
                });
            });
        });

        // Select photo
        photoInput.addEventListener("change", function() {
            var file = photoInput.files[0];

            if (!file) {
                return;
            }

            if (!file.type.startsWith("image/")) {
                alert("Please choose an image file.");
                photoInput.value = "";
                return;
            }

            if (file.size > 2 * 1024 * 1024) {
                alert("Please choose an image smaller than 2 MB.");
                photoInput.value = "";
                return;
            }

            var reader = new FileReader();

            reader.onload = function() {
                selectedPhoto = reader.result;
                photoPreview.src = selectedPhoto;
                previewContainer.classList.remove("hidden");
            };

            reader.readAsDataURL(file);
        });

        // Remove photo
        removePhoto.addEventListener("click", function() {
            photoInput.value = "";
            selectedPhoto = "";
            photoPreview.removeAttribute("src");
            previewContainer.classList.add("hidden");
        });

        // Display review
        function displayReview(name, rating, message, photo) {
            var card = document.createElement("article");

            card.className =
                "rounded-2xl border border-pink-100 bg-white p-6 shadow-md";

            var heading = document.createElement("h3");
            heading.className = "mb-3 break-words text-xl font-bold text-pink-600";
            heading.textContent = name;

            var ratingText = document.createElement("div");
            ratingText.className = "mb-3 text-2xl text-amber-400";
            ratingText.textContent =
                "★".repeat(rating) + "☆".repeat(5 - rating);

            var review = document.createElement("p");
            review.className =
                "whitespace-pre-wrap break-words leading-7 text-gray-600";
            review.textContent = message;

            card.appendChild(heading);
            card.appendChild(ratingText);
            card.appendChild(review);

            if (photo) {
                var image = document.createElement("img");
                image.src = photo;
                image.alt = "Customer review photo";
                image.className =
                    "mt-4 max-h-72 w-full rounded-xl bg-pink-50 object-contain";

                card.appendChild(image);
            }

            reviewsList.prepend(card);
        }

        // Load saved reviews
        var savedReviews = [];

        try {
            savedReviews = JSON.parse(
                localStorage.getItem("rozevaReviews") || "[]"
            );

            if (!Array.isArray(savedReviews)) {
                savedReviews = [];
            }
        } catch (error) {
            savedReviews = [];
        }

        savedReviews.forEach(function(item) {
            if (
                item &&
                typeof item.name === "string" &&
                Number.isInteger(item.rating) &&
                item.rating >= 1 &&
                item.rating <= 5 &&
                typeof item.message === "string"
            ) {
                displayReview(
                    item.name,
                    item.rating,
                    item.message,
                    typeof item.photo === "string" ? item.photo : ""
                );
            }
        });

        if (reviewsList.querySelector("article")) {
            emptyMessage.classList.add("hidden");
        }

        // Send review
        reviewForm.addEventListener("submit", function(event) {
            event.preventDefault();

            var name = document.querySelector("#customerName").value.trim();
            var message = document.querySelector("#reviewText").value.trim();

            if (selectedRating === 0) {
                alert("Please select a star rating.");
                return;
            }

            if (name === "" || message === "") {
                alert("Please enter your name and review.");
                return;
            }

            var newReview = {
                name: name,
                rating: selectedRating,
                message: message,
                photo: selectedPhoto
            };

            emptyMessage.classList.add("hidden");

            displayReview(
                newReview.name,
                newReview.rating,
                newReview.message,
                newReview.photo
            );

            savedReviews.unshift(newReview);

            try {
                localStorage.setItem(
                    "rozevaReviews",
                    JSON.stringify(savedReviews)
                );
            } catch (error) {
                alert("Review displayed, but browser storage is full.");
            }

            // Reset form
            reviewForm.reset();

            selectedRating = 0;
            selectedPhoto = "";

            photoPreview.removeAttribute("src");
            previewContainer.classList.add("hidden");

            stars.forEach(function(star) {
                star.classList.remove("text-amber-400");
                star.classList.add("text-gray-300");
            });
        });
    </script>

</body>
</html>
